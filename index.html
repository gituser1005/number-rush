<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16243a">
  <title>NUMBER RUSH | 数字パズル</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif; background:#0d1727; color:#eaf1fa; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:24px 14px; }
    .game { width:min(100%,480px); }
    .board { padding:19px; display:grid; gap:14px; border:1px solid #3a506d; border-radius:20px; background:linear-gradient(150deg,#1a2c42,#111b2b); box-shadow:0 10px 38px #0004; }
    .heading,.footer { display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .heading strong { letter-spacing:.04em; font-size:18px; color:#fff; }
    .heading span,.footer { font-size:12px; color:#b5c7dd; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .stat { padding:12px 14px; border-radius:12px; background:#2a3e56; }
    .stat label { display:block; font-size:12px; color:#bcd0e5; }
    .stat strong { font-size:32px; font-variant-numeric:tabular-nums; }
    .track { background:#42566d; border-radius:20px; height:8px; overflow:hidden; }
    .fill { background:#9fc8fa; width:100%; height:100%; transition:background-color .2s; }
    .stage { text-align:center; color:#c2d7f0; font-size:13px; }
    .target { background:#2a405c; border:1px solid #557395; border-radius:14px; padding:17px; text-align:center; }
    .target small { display:block; font-size:12px; color:#c1d5f0; }
    .target strong { font-size:60px; line-height:1.2; color:#fff; }
    .expression { display:flex; justify-content:center; align-items:center; padding:12px; min-height:75px; background:#101b2a; border:1px solid #48617d; border-radius:12px; font-size:25px; overflow-wrap:anywhere; text-align:center; line-height:1.5; }
    .caption { font-size:12px; color:#b9ccdf; }
    .keys { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; }
    button { font:inherit; cursor:pointer; touch-action:manipulation; }
    button:focus-visible,input:focus-visible { outline:3px solid #9fc8fa; outline-offset:3px; }
    button:disabled { opacity:.35; cursor:default; }
    button:active:not(:disabled) { transform:scale(.97); }
    .key { min-height:61px; border:1px solid #7796ba; border-radius:11px; background:#365477; color:white; font-size:26px; font-weight:750; }
    .key.op { background:#2b3d53; border-color:#546e8c; }
    .actions { display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:8px; }
    .action { padding:13px 3px; border:1px solid #55708b; border-radius:10px; background:#2b3e55; color:#eef4fc; font-size:14px; font-weight:700; }
    .action.main,.start { border:0; background:#a7d0ff; color:#142539; }
    .message { min-height:23px; text-align:center; color:#f3b1b1; font-size:13px; }
    .message.good { color:#8ce7b8; }
    .small-button { border:1px solid #5b7591; border-radius:8px; background:transparent; color:#e4effe; padding:8px; font-size:12px; }
    .setup { display:grid; gap:14px; padding:18px; background:#293d55; border:1px solid #597693; border-radius:15px; }
    .setup h2 { margin:0; text-align:center; font-size:21px; }
    .setup p { margin:0; text-align:center; font-size:13px; line-height:1.7; color:#c9daee; }
    .group-label { margin:12px 0 8px; font-size:12px; font-weight:700; color:#bad3ef; }
    .group-label:first-child { margin-top:0; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .field { background:#1b2b40; border:1px solid #4a6481; border-radius:11px; padding:10px; display:grid; gap:7px; }
    .field label { font-size:12px; color:#d0e0f2; line-height:1.4; }
    .field input { width:100%; min-width:0; padding:8px; border:1px solid #829ab5; border-radius:8px; background:#111d2d; color:#fff; text-align:center; font-size:22px; font-weight:700; }
    .start { width:100%; padding:14px; border-radius:10px; font-weight:800; font-size:16px; }
    .final-score { font-size:39px; font-weight:800; text-align:center; color:#c1ddff; }
    .rules { margin:12px 0 0; text-align:center; font-size:12px; line-height:1.7; color:#a0b6cd; }
    .hidden { display:none !important; }
    @media(max-width:370px) { body{padding:10px 5px}.board{padding:11px;gap:11px}.key{min-height:54px}.actions{gap:5px}.action{font-size:12px} }
  </style>
</head>
<body>
  <main class="game">
    <div class="board">
      <header class="heading"><strong>NUMBER RUSH</strong><span id="status">3–9 CHALLENGE</span></header>
      <section class="setup" id="setup">
        <h2 id="setup-title">出題数を設定</h2>
        <p id="setup-description">手札は3〜9からランダムに4枚。<br>2は登場しません。</p>
        <div id="settings">
          <div class="group-label">最初のステージ</div>
          <div class="fields">
            <div class="field"><label for="two">数字2個の問題数</label><input id="two" type="number" inputmode="numeric" min="0" max="999" step="1" value="10"></div>
            <div class="field"><label for="three">数字3個の問題数</label><input id="three" type="number" inputmode="numeric" min="0" max="999" step="1" value="10"></div>
          </div>
          <div class="group-label">以降は繰り返し</div>
          <div class="fields">
            <div class="field"><label for="cycle3">数字3個の問題数</label><input id="cycle3" type="number" inputmode="numeric" min="0" max="999" step="1" value="10"></div>
            <div class="field"><label for="cycle4">数字4個の問題数</label><input id="cycle4" type="number" inputmode="numeric" min="0" max="999" step="1" value="4"></div>
          </div>
        </div>
        <div class="final-score hidden" id="final-score"></div>
        <button class="start" id="start">ゲームスタート</button>
      </section>
      <div class="stats">
        <div class="stat"><label>残り時間</label><strong id="time">60.0</strong><span> 秒</span></div>
        <div class="stat"><label>クリア数</label><strong id="score">0</strong><span> 問</span></div>
      </div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="stage" id="stage">スタート前</div>
      <div class="target"><small>この数字を作ろう</small><strong id="target">?</strong></div>
      <div class="expression" id="expression" aria-label="入力中の数式">—</div>
      <div class="caption">今回の手札（何度でも使用可能）</div>
      <div class="keys" id="number-keys"></div>
      <div class="keys">
        <button class="key op" data-op="+">+</button>
        <button class="key op" data-op="-">−</button>
        <button class="key op" data-op="*">×</button>
        <button class="key op" data-op="/">÷</button>
      </div>
      <div class="actions">
        <button class="action" id="back">⌫ 戻す</button>
        <button class="action" id="clear">全消去</button>
        <button class="action main" id="check">判定 ✓</button>
      </div>
      <div class="message" id="message" aria-live="polite"></div>
      <footer class="footer"><span id="best">最高記録：0問</span><button class="small-button" id="reset">設定に戻る</button></footer>
    </div>
    <p class="rules">初期60秒・正解で+5秒・スキップなし<br>括弧なし・通常の演算優先順位・途中結果は非表示<br>キーボードでも入力可（数字、+ - * /、Enter、Backspace、Esc）</p>
  </main>
  <script>
  (() => {
    'use strict';
    const $ = id => document.getElementById(id);
    const ops = ['+','-','*','/'];
    const pick = a => a[Math.floor(Math.random() * a.length)];
    let hand=[], pools={}, examples={}, tokens=[], target=null, score=0, best=0, state='ready';
    let remaining=60, deadline=0, frame=0, noticeTimer=0, recent=[];
    let config={two:10,three:10,cycle3:10,cycle4:4};

    // Evaluate tokenized single-digit expressions using ordinary multiplication/division precedence.
    function evaluate(t) {
      if (!t.length || t.length % 2 !== 1) return null;
      const nums=[];
      for (let i=0;i<t.length;i++) {
        if (i%2===0) {
          if (!hand.some(n=>String(n)===t[i])) return null;
          nums.push(Number(t[i]));
        } else if (!ops.includes(t[i])) return null;
      }
      const chunks=[nums[0]], low=[];
      for(let i=1;i<nums.length;i++) {
        const operator=t[2*i-1], number=nums[i];
        if(operator==='*' || operator==='/') {
          const last=chunks.pop();
          const value=operator==='*' ? last*number : last/number;
          if(!Number.isFinite(value)) return null;
          chunks.push(value);
        } else {
          chunks.push(number);low.push(operator);
        }
      }
      let result=chunks[0];
      for(let i=0;i<low.length;i++) result += low[i]==='+' ? chunks[i+1] : -chunks[i+1];
      return Number.isFinite(result) ? result : null;
    }

    // Enumerate reachable targets from expressions containing exactly 2, 3 or 4 number tokens.
    function buildPools() {
      pools={2:new Set(),3:new Set(),4:new Set()};
      examples={2:new Map(),3:new Map(),4:new Map()};
      for(let length=2;length<=4;length++) {
        function walk(t,k) {
          if(k===length) {
            const value=evaluate(t);
            if(value!==null && Number.isInteger(value) && value>=9 && value<=70) {
              pools[length].add(value);
              if(!examples[length].has(value)) examples[length].set(value,[...t]);
            }
            return;
          }
          for(const digit of hand) {
            if(k===0) walk([String(digit)],1);
            else for(const operator of ops) walk([...t,operator,String(digit)],k+1);
          }
        }
        walk([],0);
      }
    }
    function phase() {
      if(score<config.two) return {n:2,label:`数字2個 · ${score+1}/${config.two}問`};
      if(score<config.two+config.three) return {n:3,label:`数字3個 · ${score-config.two+1}/${config.three}問`};
      const span=config.cycle3+config.cycle4;
      if(!span) return {n:3,label:'数字3個 · 継続'};
      const pos=(score-config.two-config.three)%span;
      return pos<config.cycle3
        ? {n:3,label:`数字3個 · ${pos+1}/${config.cycle3}問（繰り返し）`}
        : {n:4,label:`数字4個 · ${pos-config.cycle3+1}/${config.cycle4}問（繰り返し）`};
    }
    function newTarget() {
      const n=phase().n, full=[...pools[n]];
      let candidates=full.filter(v=>!recent.includes(v));
      if(n>2) {
        const shorter=n===3 ? pools[2] : new Set([...pools[2],...pools[3]]);
        const harder=candidates.filter(v=>!shorter.has(v));
        if(harder.length) candidates=harder;
      }
      if(!candidates.length) candidates=full.filter(v=>v!==target);
      if(!candidates.length) candidates=full;
      // Guaranteed-reachable fallback (hand digits are always 3...9).
      const result=candidates.length ? pick(candidates) : hand[0]+hand[1];
      recent.push(result);
      if(recent.length>6) recent.shift();
      return result;
    }
    function drawTime() {
      $('time').textContent=Math.max(0,remaining).toFixed(1);
      $('fill').style.width=Math.max(0,Math.min(100,remaining/60*100))+'%';
      $('fill').style.background=remaining<10 ? '#ee8c8c' : remaining<20 ? '#f0c37b' : '#9fc8fa';
    }
    function render() {
      drawTime();
      $('score').textContent=score;
      $('target').textContent=target===null?'?':target;
      $('stage').textContent=state==='ready'?'スタート前':phase().label;
      $('expression').textContent=tokens.length
        ? tokens.map(x=>({'*':'×','/':'÷','-':'−'}[x]||x)).join(' ')
        : '—';
      $('best').textContent=`最高記録：${best}問`;
      const active=state==='playing' && performance.now()<deadline;
      document.querySelectorAll('[data-num]').forEach(b=>b.disabled=!active||tokens.length%2!==0||tokens.length>=49);
      document.querySelectorAll('[data-op]').forEach(b=>b.disabled=!active||tokens.length%2===0||tokens.length>=49);
      $('back').disabled=!active||!tokens.length;
      $('clear').disabled=!active||!tokens.length;
      $('check').disabled=!active||evaluate(tokens)===null;
    }
    function notice(text,good=false) {
      clearTimeout(noticeTimer);
      $('message').textContent=text;
      $('message').className='message'+(good?' good':'');
      if(text) noticeTimer=setTimeout(()=>{$('message').textContent='';},1100);
    }
    function finish() {
      if(state!=='playing') return;
      state='over';remaining=0;cancelAnimationFrame(frame);
      best=Math.max(best,score);
      $('status').textContent='TIME UP';
      $('setup-title').textContent='タイムアップ！';
      $('setup-description').textContent='今回の手札：'+hand.join('・');
      $('settings').classList.add('hidden');
      $('final-score').textContent=score+' 問';
      $('final-score').classList.remove('hidden');
      $('start').textContent='同じ設定で再挑戦';
      $('setup').classList.remove('hidden');
      notice('');render();
    }
    function tick() {
      if(state!=='playing') return;
      remaining=Math.max(0,(deadline-performance.now())/1000);
      drawTime();
      if(remaining<=0) {finish();return;}
      frame=requestAnimationFrame(tick);
    }
    function makeHand() {
      const available=[3,4,5,6,7,8,9]; // 2 excluded; 5 currently retained.
      for(let i=available.length-1;i>0;i--) {
        const j=Math.floor(Math.random()*(i+1));
        [available[i],available[j]]=[available[j],available[i]];
      }
      hand=available.slice(0,4).sort((a,b)=>a-b);
      $('number-keys').replaceChildren();
      for(const n of hand) {
        const button=document.createElement('button');
        button.className='key';button.dataset.num=String(n);button.textContent=String(n);
        button.addEventListener('click',()=>append(String(n)));
        $('number-keys').appendChild(button);
      }
    }
    function readSetting(id,defaultValue) {
      const raw=$(id).value.trim();
      if(raw==='') return defaultValue;
      const v=Number(raw);
      return Number.isFinite(v) ? Math.max(0,Math.min(999,Math.floor(v))) : defaultValue;
    }
    function start() {
      if(state==='ready') {
        config={two:readSetting('two',10),three:readSetting('three',10),cycle3:readSetting('cycle3',10),cycle4:readSetting('cycle4',4)};
        for(const [name,id] of [['two','two'],['three','three'],['cycle3','cycle3'],['cycle4','cycle4']]) $(id).value=config[name];
      }
      cancelAnimationFrame(frame);
      state='playing';remaining=60;score=0;tokens=[];target=null;recent=[];
      makeHand();buildPools();target=newTarget();
      deadline=performance.now()+60000;
      $('status').textContent='PLAYING';$('setup').classList.add('hidden');
      notice('');render();frame=requestAnimationFrame(tick);
    }
    function append(token) {
      if(state!=='playing') return;
      if(performance.now()>=deadline) {finish();return;}
      if(tokens.length>=49) return;
      const isNum=hand.some(n=>String(n)===token), needNum=tokens.length%2===0;
      if(isNum!==needNum || (!isNum && !ops.includes(token))) return;
      tokens.push(token);notice('');render();
    }
    function check() {
      if(state!=='playing') return;
      if(performance.now()>=deadline) {finish();return;}
      const value=evaluate(tokens);
      if(value===null) return;
      if(Math.abs(value-target)<1e-9) {
        score++;best=Math.max(best,score);deadline+=5000;
        remaining=Math.max(0,(deadline-performance.now())/1000);
        target=newTarget();tokens=[];
        notice('正解！ +5秒',true);render();
      } else notice('不正解');
    }
    function reset() {
      cancelAnimationFrame(frame);
      state='ready';remaining=60;score=0;tokens=[];target=null;
      $('status').textContent='3–9 CHALLENGE';
      $('setup-title').textContent='出題数を設定';
      $('setup-description').innerHTML='手札は3〜9からランダムに4枚。<br>2は登場しません。';
      $('settings').classList.remove('hidden');$('final-score').classList.add('hidden');
      $('start').textContent='ゲームスタート';$('setup').classList.remove('hidden');
      notice('');render();
    }
    document.querySelectorAll('[data-op]').forEach(b=>b.addEventListener('click',()=>append(b.dataset.op)));
    $('back').addEventListener('click',()=>{if(state==='playing'){tokens.pop();notice('');render();}});
    $('clear').addEventListener('click',()=>{if(state==='playing'){tokens=[];notice('');render();}});
    $('check').addEventListener('click',check);
    $('start').addEventListener('click',start);
    $('reset').addEventListener('click',reset);
    document.addEventListener('keydown',e=>{
      if(state!=='playing'||['INPUT','BUTTON','TEXTAREA'].includes(e.target.tagName))return;
      if((/^[3-9]$/.test(e.key)&&hand.includes(Number(e.key)))||ops.includes(e.key)) {e.preventDefault();append(e.key);}
      else if(e.key==='Backspace') {e.preventDefault();tokens.pop();notice('');render();}
      else if(e.key==='Escape') {e.preventDefault();tokens=[];notice('');render();}
      else if(e.key==='Enter') {e.preventDefault();check();}
    });
    render();
  })();
  </script>
</body>
</html>
